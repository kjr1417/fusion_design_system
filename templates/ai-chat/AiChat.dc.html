<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="AI Chat" description="Full Fusion conversational surface built from the real Chat componentry: ChatHistoryPanel sidebar, ChatHeader, ConversationArea (rich response blocks — code, diffs, images, artifacts, comparisons, inline forms, expandables, Test Mode), a clarifying-question card, PromptInput composer, and an ArtifactsPanel library." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{color:var(--salt-content-accent-foreground);text-decoration:none}
a:hover{color:var(--salt-color-blue-700)}
.ai-composer-mount{display:flex;flex-direction:column;min-height:0;flex:0 0 auto}
.ai-composer-mount>.sc-host-x{display:flex!important;flex-direction:column!important;min-height:0!important;flex:0 0 auto!important;width:100%}
.ai-conversation-mount{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.ai-conversation-mount>.sc-host-x{display:flex!important;flex-direction:column!important;min-height:0!important;flex:1 1 auto!important;width:100%;height:100%;overflow:hidden!important}
.ai-main{margin:8px 16px 16px 16px;min-width:360px}
.ai-main.panel-open{margin-right:0}
.ai-main.rail-collapsed{margin-left:8px}
.ai-history-mount.collapsed>.sc-host-x{margin-left:8px}
</style>
</helmet>
<div class="salt-theme salt-density-low" style="height:100vh;overflow:hidden;background:var(--salt-palette-background-secondary);font-family:var(--salt-text-fontFamily);color:var(--salt-content-primary-foreground);display:flex;flex-direction:column">
<x-import component-from-global-scope="FusionDesignSystem_6db751.GlobalNav" hint-size="100%,68px" style="flex-shrink:0"></x-import>
<div style="display:flex;flex:1;min-height:0;position:relative">
<div class="{{ historyMountClass }}" style="flex-shrink:0"><x-import component-from-global-scope="FusionDesignSystem_6db751.ChatHistoryPanel" groups="{{ historyGroups }}" onNewChat="{{ newChat }}" collapsed="{{ sidebarCollapsed }}" onCollapsedChange="{{ onSidebarCollapsedChange }}" searchValue="{{ historySearch }}" onSearchChange="{{ onHistorySearchChange }}" hint-size="300px,100%" style="flex-shrink:0"></x-import></div>
<main class="ai-main {{ mainExtraClass }} {{ mainRailClass }}" style="flex:1;min-width:0;display:flex;flex-direction:column;background:#FFFFFF;border-radius:var(--salt-palette-corner-stronger);box-shadow:var(--salt-overlayable-shadow);position:relative;z-index:2;min-height:0;overflow:hidden">
<x-import component-from-global-scope="FusionDesignSystem_6db751.ChatHeader" title="{{ chatTitle }}" onTitleChange="{{ onTitleChange }}" onOpenLibrary="{{ toggleLibrary }}" libraryOpen="{{ libraryOpen }}" onDownload="{{ downloadChat }}" hint-size="100%,44px" style="flex-shrink:0;position:relative;z-index:2;padding:0 24px;background:var(--salt-container-primary-background)"></x-import>
<sc-if value="{{ isWelcome }}" hint-placeholder-val="{{ false }}">
<div style="flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column">
<div style="flex-basis:20%;flex-shrink:0"></div>
<div style="display:flex;flex-direction:column;align-items:center;padding:0 var(--salt-spacing-200)">
<div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:700px;min-width:400px;box-sizing:border-box">
<div style="font-family:var(--salt-text-display2-fontFamily);font-weight:var(--salt-text-display2-fontWeight);font-size:var(--salt-text-display2-fontSize);line-height:var(--salt-text-display2-lineHeight);color:var(--salt-content-primary-foreground);text-align:center">{{ welcomeTitle }}</div>
<div style="margin-top:var(--salt-spacing-100);font-family:var(--salt-text-h2-fontFamily);font-weight:var(--salt-text-h2-fontWeight);font-size:var(--salt-text-h2-fontSize);line-height:var(--salt-text-h2-lineHeight);color:var(--salt-content-secondary-foreground);text-align:center">{{ welcomeDescription }}</div>
<div style="margin-top:var(--salt-spacing-800);width:100%">
<x-import component-from-global-scope="FusionDesignSystem_6db751.PromptInput" value="{{ draft }}" onChange="{{ onDraftChange }}" onSend="{{ onSend }}" helperText="{{ composerHelperText }}" hint-size="100%,150px" style="width:100%"></x-import>
</div>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{ isChat }}" hint-placeholder-val="{{ true }}">
<div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:0 24px">
<div class="ai-conversation-mount" style="max-width:820px;width:100%;margin:0 auto">
<x-import component-from-global-scope="FusionDesignSystem_6db751.ConversationArea" messages="{{ messages }}" onCopyMessage="{{ onCopyMessage }}" onSubmitEdit="{{ onSubmitEdit }}" onChangeVersion="{{ onChangeVersion }}" onSelectComparisonOption="{{ onSelectComparisonOption }}" onRetryMessage="{{ onRetryMessage }}" onFeedback="{{ onFeedback }}" onDownloadMessage="{{ onDownloadMessage }}" onAtBottomChange="{{ onAtBottomChange }}" scrollToBottomSignal="{{ scrollNonce }}" scrollToLatest="{{ showScrollToLatest }}" onScrollToLatest="{{ scrollToLatest }}" hint-size="100%,100%" style="flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column"></x-import>
</div>
</div>
<div style="flex:0 0 auto;position:relative;z-index:2;padding:20px 24px;background:var(--salt-container-primary-background);display:flex;flex-direction:column">
<div class="ai-composer-mount" style="max-width:820px;width:100%;margin:0 auto">
<x-import component-from-global-scope="FusionDesignSystem_6db751.PromptInput" value="{{ draft }}" onChange="{{ onDraftChange }}" onSend="{{ onSend }}" helperText="{{ composerHelperText }}" hint-size="100%,150px" style="width:100%;min-height:0;flex:1 1 auto" overlay="{{ requirementsOverlay }}"></x-import>
</div>
</div>
</sc-if>
</main>
<sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ false }}">
<div style="flex:0 1 {{ previewWidthPx }}px;min-width:320px;max-width:640px;margin:8px 16px 16px 16px;background:#FFFFFF;border-radius:var(--salt-palette-corner-stronger);box-shadow:var(--salt-overlayable-shadow);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:2">
<div onPointerDown="{{ startPreviewResize }}" role="separator" aria-orientation="vertical" aria-label="Resize panel" style="position:absolute;top:0;bottom:0;left:-8px;width:12px;cursor:col-resize;z-index:3"></div>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--salt-spacing-200)">
<x-import component-from-global-scope="FusionDesignSystem_6db751.SidePanelHeader" title="{{ panelTitle }}" secondary-info="{{ panelSecondaryInfo }}" onClose="{{ closeSidePanel }}" onBack="{{ panelOnBack }}" description="{{ panelDescription }}" actions="{{ panelActions }}" hint-size="100%,80px"></x-import>
<sc-if value="{{ previewOpen }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;overflow:auto;margin-top:var(--salt-spacing-200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--salt-spacing-150);background:var(--salt-palette-background-secondary);border-radius:var(--salt-palette-corner)">
<span style="display:grid;place-items:center;width:64px;height:64px;border-radius:14px;background:var(--domain-documentation-fill);color:var(--domain-documentation-bold)">{{ previewIcon }}</span>
<div style="font-size:15px;font-weight:700;color:var(--salt-content-primary-foreground)">{{ previewTitle }}</div>
<div style="font-size:13px;color:var(--salt-content-secondary-foreground)">Preview not available — download the file to view its contents.</div>
</div>
</sc-if>
<sc-if value="{{ libraryListOpen }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;overflow:auto;margin-top:var(--salt-spacing-200)">
<sc-if value="{{ libraryEmpty }}" hint-placeholder-val="{{ false }}">
<div style="padding:24px 0;font-size:13px;color:var(--salt-content-secondary-foreground);text-align:center">Artifacts you create in this conversation will appear here.</div>
</sc-if>
<sc-for list="{{ artifactRows }}" as="a" hint-placeholder-count="2">
<div style="padding:var(--salt-spacing-150) 0;border-bottom:1px solid var(--salt-separable-secondary-borderColor)">
<x-import component-from-global-scope="FusionDesignSystem_6db751.ArtifactCard" title="{{ a.title }}" description="{{ a.description }}" action-label="View" onAction="{{ a.onView }}" secondary-action="{{ a.downloadButton }}" hint-size="100%,60px"></x-import>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ libraryDetailOpen }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;overflow:auto;margin-top:var(--salt-spacing-200);font-size:14px;line-height:1.6;color:var(--salt-content-primary-foreground)">
<div style="font-size:13px;color:var(--salt-content-secondary-foreground);margin-bottom:var(--salt-spacing-200)">{{ librarySelectedDescription }}</div>
<div style="padding:var(--salt-spacing-300);text-align:center;border:1px dashed var(--salt-separable-secondary-borderColor);border-radius:var(--salt-palette-corner-weaker);color:var(--salt-content-secondary-foreground);font-size:13px">Artifact preview — {{ librarySelectedTitle }}</div>
</div>
</sc-if>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:800},&quot;agentName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Builder_Agent_v2&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Agent&quot;},&quot;enableClarifyingQuestions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const skipQuestions = props && props.enableClarifyingQuestions === false;
    const messages = [
      { role: 'user', text: "Triage the last 60 days of advisory-desk emails — cluster by theme, flag Platinum-tier urgencies, and produce a leadership-ready summary report.", attachments: [{ title: 'advisory-desk-emails.zip', description: '60-day export', fileType: 'zip' }] },
      { role: 'agent', name: this.agentNameFor(props), time: this.now(), text: skipQuestions ? 'On it — spinning up the triage workflow now.' : 'I have a few questions before I start building —' },
    ];
    this.state = {
      sidebarCollapsed: false,
      libraryOpen: false,
      activeChat: 0,
      chats: ['Advisory desk triage', 'Q4 board deck summary', 'Python ETL script', 'Compliance rules Q&A', 'Draft email to desk lead', 'Model comparison notes', 'SQL join query', 'Java code review', 'RAG best practices', 'Audit prep checklist'],
      messages,
      pendingQuestion: !skipQuestions,
      requirementStep: 0,
      requirementAnswers: [],
      requirementContext: '',
      draft: '',
      atBottom: true,
      scrollNonce: 0,
      isWelcome: false,
      previewOpen: false,
      previewArtifact: null,
      previewWidth: 560,
      librarySelected: null,
      historySearch: '',
    };
  }

  componentDidMount() {
    if (this.props && this.props.enableClarifyingQuestions === false) setTimeout(() => this.startBuild(), 400);
  }

  dsIcon(name, size = 20) {
    const url = `url(../../icons/${name}.svg)`;
    return React.createElement('span', { style: { display: 'inline-block', width: size, height: size, flexShrink: 0, background: 'currentColor', WebkitMask: `${url} center/contain no-repeat`, mask: `${url} center/contain no-repeat` } });
  }
  agentNameFor(props) { return (props && props.agentName) || 'Builder_Agent_v2'; }
  agentName() { return this.agentNameFor(this.props); }
  now() { const d = new Date(); let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + (m < 10 ? '0' + m : m) + ap; }

  flow() {
    return [
      { text: 'Where is your client email data stored?', type: 'single-select', options: [
        { label: 'Microsoft Outlook / Exchange — connect via Microsoft Graph API', value: 'outlook' },
        { label: 'Gmail / Google Workspace — authorize via Gmail API', value: 'gmail' },
        { label: "Upload an export (CSV, JSON, or .pst) of the last 60 days", value: 'upload' },
        { label: 'Our CRM already has email history pulled in (Salesforce, Dynamics)', value: 'crm' },
      ] },
      { text: 'How should Platinum-tier urgencies be flagged?', description: 'This determines how the desk lead is notified once triage completes.', type: 'single-select', options: [
        { label: 'Send an email alert to the desk lead', value: 'email' },
        { label: 'Post to #advisory-ops in Slack / Teams', value: 'slack' },
        { label: 'Roll them into a daily 8am digest', value: 'digest' },
        { label: 'Create a follow-up task in our CRM', value: 'crm-task' },
      ] },
    ];
  }

  submitRequirements() {
    const flow = this.flow();
    const answers = this.state.requirementAnswers;
    this.setState((s) => {
      const messages = [...s.messages];
      flow.forEach((q, i) => {
        const a = answers[i];
        const label = Array.isArray(a) ? a.map((v) => (q.options.find((o) => o.value === v) || {}).label || v).join(', ') : (q.options.find((o) => o.value === a) || {}).label || a;
        if (label) messages.push({ role: 'user', text: label });
      });
      return { messages, pendingQuestion: null, requirementStep: 0, requirementAnswers: [] };
    });
    setTimeout(() => this.startBuild(), 400);
  }
  skipQuestions() {
    this.setState({ pendingQuestion: null, requirementStep: 0, requirementAnswers: [] });
    setTimeout(() => this.startBuild(), 400);
  }

  startBuild() {
    const steps = [
      'Connecting to Microsoft Graph API…',
      'Scanning 1,240 emails from the last 60 days…',
      'Clustering by theme — 8 themes identified…',
      'Flagging Platinum-tier urgencies — 12 flagged…',
      'Composing the leadership summary…',
    ];
    let idx = 0;
    const addNext = () => {
      this.setState((s) => {
        const messages = s.messages.map((m) => (m.role === 'status' ? { ...m, done: true } : m));
        if (idx < steps.length) messages.push({ role: 'status', text: steps[idx], done: false });
        return { messages };
      });
      idx++;
      if (idx <= steps.length) setTimeout(addNext, 1000);
      else setTimeout(() => this.finishBuild(), 400);
    };
    addNext();
  }

  finishBuild() {
    this.setState((s) => {
      const messages = s.messages.map((m) => (m.role === 'status' ? { ...m, done: true } : m));
      messages.push({ role: 'agent', name: this.agentName(), time: this.now(), blocks: this.richAnswerBlocks() });
      messages.push({ role: 'user', text: 'Try this against the sandbox agent first.', testMode: true, testSummary: 'Ran 3 sandbox iterations narrowing the SLA threshold and excluding Account Access. Final result: 7 themes, 29 items.' });
      messages.push({ role: 'agent', name: this.agentName(), time: this.now(), text: 'Sandbox run complete — 3 themes matched.', testMode: true });
      messages.push({ role: 'status', text: 'Re-running with the widened threshold…', done: true, testMode: true });
      messages.push({ role: 'agent', name: this.agentName(), time: this.now(), text: 'Excluded Account Access — backlog drops to 29 items across 7 themes.', testMode: true });
      return { messages };
    });
  }

  richAnswerBlocks() {
    return [
      { type: 'h1', text: 'Advisory Desk Email Summary' },
      { type: 'h2', text: 'Overview' },
      { type: 'body', text: 'Triaged **1,240 emails** from the last 60 days into *8 themes*, with 12 items flagged Platinum tier.', source: { platform: 'Confluence', title: 'Advisory Desk Playbook', description: 'Escalation rules and SLA thresholds for Platinum-tier items.', url: '#' } },
      { type: 'blockquote', text: "Escalate anything tagged Platinum before Friday's sync.", children: { text: 'Per the desk-owner playbook, Platinum items page the on-call lead directly.' } },
      { type: 'ol', items: [
        { text: 'Pull the 60-day export', children: [{ text: 'Filter to advisory-desk mailboxes' }] },
        { text: 'Cluster by theme' },
        { text: 'Flag Platinum-tier urgencies' },
      ] },
      { type: 'disclaimer', text: 'AI-generated summary — verify figures against the source export before distributing.' },
      { type: 'status', status: 'warning', statusTitle: '12 items need review', text: 'Tagged Platinum tier — pages the on-call lead if unread after 1 hour.' },
      { type: 'code', language: 'python', code: 'def triage(emails):\n    return [e for e in emails if e.tier == "platinum"]' },
      { type: 'code', language: 'diff', diffLines: [
        { kind: 'context', text: 'def triage(emails):' },
        { kind: 'remove', text: '    return [e for e in emails if e.urgent]' },
        { kind: 'add', text: '    return [e for e in emails if e.tier == "platinum"]' },
      ] },
      { type: 'image', imageSrc: 'https://picsum.photos/seed/aichat-wide/900/380', imageAlt: 'Weekly triage volume' },
      { type: 'image', imageSrc: 'https://picsum.photos/seed/aichat-square/560/560', imageAlt: 'Theme distribution' },
      { type: 'artifact', artifact: { eyebrow: 'Report', title: 'Advisory Desk Email Summary.pdf', description: 'Generated from the 60-day mailbox export', items: [{ label: 'Size', value: '2.1 MB' }, { label: 'Created', value: 'Aug 17, 2026' }], actionLabel: 'View', onDownload: () => {}, onAction: () => this.openPreview({ title: 'Advisory Desk Email Summary.pdf', secondaryInfo: 'PDF · 2.1 MB', description: 'Generated from the 60-day mailbox export' }) } },
      { type: 'comparison', comparisonOptions: [
        { label: 'Option A — concise', text: "12 items flagged Platinum. Escalate before Friday's sync." },
        { label: 'Option B — detailed', text: "12 items across 8 themes are flagged Platinum tier — escalate all 12 before Friday's leadership sync." },
      ] },
      { type: 'form', form: { steps: [{ title: 'Route this report', description: 'Choose up to three teams who should review this before it goes out.', fieldLabel: 'Reviewing teams', fieldPlaceholder: 'Search teams…', options: [
        { value: 'risk', label: 'Risk Analytics', metadata: [{ label: 'Members', value: '14' }] },
        { value: 'markets', label: 'Markets Tech', metadata: [{ label: 'Members', value: '22' }] },
        { value: 'cdao', label: 'CDAO Data Eng.', metadata: [{ label: 'Members', value: '9' }] },
      ] }] } },
      { type: 'expandable', summary: [{ type: 'body', text: '3 of 8 themes account for 70% of the backlog.' }], details: [
        { type: 'ul', items: [
          { text: 'Account access issues — 42 emails' },
          { text: 'Fee disclosure questions — 18 emails' },
          { text: 'Onboarding delays — 11 emails' },
        ] },
      ] },
      { type: 'files', files: [
        { id: 1, name: 'advisory-desk-emails.zip', size: 84000000, type: 'ZIP' },
        { id: 2, name: 'org-chart.pdf', size: 512000, type: 'PDF' },
      ], columns: [{ key: 'type', label: 'Type' }] },
    ];
  }

  sendMessage(text) {
    const t = (text || '').trim();
    if (!t) return;
    this.setState((s) => ({ isWelcome: false, messages: [...s.messages, { role: 'user', text: t }, { role: 'typing', name: this.agentName(), labels: ['Reviewing your request…', 'Checking the latest report…', 'Drafting a reply…'] }], draft: '' }));
    setTimeout(() => {
      this.setState((s) => {
        const messages = s.messages.filter((m) => m.role !== 'typing');
        const clean = t.replace(/\s+/g, ' ');
        const short = clean.length > 64 ? clean.slice(0, 64) + '…' : clean;
        messages.push({ role: 'agent', name: this.agentName(), time: this.now(), text: 'Got it — I\u2019ll work on \u201C' + short + '\u201D. Let me line up the right tools and data sources, then I\u2019ll walk you through the plan.' });
        return { messages };
      });
    }, 1600);
  }

  newChat() {
    this.setState({ activeChat: -1, isWelcome: true, previewOpen: false, pendingQuestion: null, draft: '', messages: [] });
  }

  selectChat(i) {
    const title = this.state.chats[i];
    this.setState({ activeChat: i, isWelcome: false, previewOpen: false, pendingQuestion: null, draft: '', messages: [
      { role: 'user', text: title },
      { role: 'agent', name: this.agentName(), time: this.now(), text: 'Sure — here\u2019s a starting point for \u201C' + title + '\u201D. Ask me to go deeper on any part, or send a follow-up below.' },
    ] });
  }

  openPreview(artifact) { this.setState({ previewOpen: true, previewArtifact: artifact, libraryOpen: false, librarySelected: null }); }
  closePreview() { this.setState({ previewOpen: false }); }
  openLibrary() { this.setState({ libraryOpen: true, librarySelected: null, previewOpen: false }); }
  closeLibrary() { this.setState({ libraryOpen: false, librarySelected: null }); }
  selectLibraryItem(a) { this.setState({ librarySelected: a }); }
  backLibrary() { this.setState({ librarySelected: null }); }
  startPreviewResize(e) {
    e.preventDefault();
    const startX = e.clientX;
    const startWidth = this.state.previewWidth || 560;
    const onMove = (ev) => {
      const next = Math.min(640, Math.max(320, startWidth + (startX - ev.clientX)));
      this.setState({ previewWidth: next });
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    };
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  buildDisplayMessages(canonical) {
    const out = [];
    canonical.forEach((m, ci) => {
      if (m.versions) {
        const v = m.versions[m.activeVersion - 1];
        out.push({ ...m, text: v.text, attachments: v.attachments, versionCount: m.versions.length, activeVersion: m.activeVersion, __ci: ci, __ri: -1 });
        (m.versionReplies[m.activeVersion - 1] || []).forEach((r, ri) => out.push({ ...r, __ci: ci, __ri: ri }));
      } else {
        out.push({ ...m, __ci: ci, __ri: -1 });
      }
    });
    return out;
  }

  editMessage(ci, text) {
    this.setState((s) => {
      const messages = [...s.messages];
      const orig = messages[ci];
      if (!orig.versions) {
        const tail = messages.slice(ci + 1);
        messages.length = ci + 1;
        messages[ci] = {
          ...orig,
          versions: [{ text: orig.text, attachments: orig.attachments }, { text, attachments: orig.attachments }],
          versionReplies: [tail, [{ role: 'typing', name: this.agentName(), labels: ['Reviewing your edit…', 'Drafting a new reply…'] }]],
          activeVersion: 2,
        };
      } else {
        messages[ci] = {
          ...orig,
          versions: [...orig.versions, { text, attachments: orig.attachments }],
          versionReplies: [...orig.versionReplies, [{ role: 'typing', name: this.agentName(), labels: ['Reviewing your edit…', 'Drafting a new reply…'] }]],
          activeVersion: orig.versions.length + 1,
        };
      }
      return { messages };
    });
    setTimeout(() => this.finishEditReply(ci), 1600);
  }

  finishEditReply(ci) {
    this.setState((s) => {
      const messages = [...s.messages];
      const m = messages[ci];
      if (!m || !m.versions) return {};
      const vIdx = m.activeVersion - 1;
      const text = (m.versions[vIdx] && m.versions[vIdx].text) || '';
      const clean = text.replace(/\s+/g, ' ');
      const short = clean.length > 64 ? clean.slice(0, 64) + '…' : clean;
      const replies = m.versionReplies.map((arr, i) => i === vIdx ? [{ role: 'agent', name: this.agentName(), time: this.now(), text: 'Got it — I\u2019ll work on \u201C' + short + '\u201D based on the updated message.' }] : arr);
      messages[ci] = { ...m, versionReplies: replies };
      return { messages };
    });
  }

  changeVersion(ci, newVersion) {
    this.setState((s) => { const messages = [...s.messages]; messages[ci] = { ...messages[ci], activeVersion: newVersion }; return { messages }; });
  }

  updateFlatMessage(ci, ri, patch) {
    this.setState((s) => {
      const messages = [...s.messages];
      const m = messages[ci];
      if (!m) return {};
      if (ri === -1) { messages[ci] = { ...m, ...patch }; }
      else if (m.versionReplies) {
        const vIdx = m.activeVersion - 1;
        const replies = m.versionReplies.map((arr, i) => i === vIdx ? arr.map((r, j) => j === ri ? { ...r, ...patch } : r) : arr);
        messages[ci] = { ...m, versionReplies: replies };
      }
      return { messages };
    });
  }

  copyMessage(m) { if (typeof navigator !== 'undefined' && navigator.clipboard && m.text) navigator.clipboard.writeText(m.text); }
  setFeedback(m, sentiment) { this.updateFlatMessage(m.__ci, m.__ri, { feedback: sentiment }); }

  artifacts() {
    return [
      { id: '1', title: 'Advisory Desk Email Summary.pdf', description: 'Leadership-ready recap of the 60-day mailbox export.' },
      { id: '2', title: 'org-chart.pdf', description: 'Desk owners referenced in the escalation flow.' },
    ];
  }

  requirementsOverlay() {
    const S = this.state;
    if (!S.pendingQuestion || !window.FusionDesignSystem_6db751) return undefined;
    const { PromptInputPlanCard } = window.FusionDesignSystem_6db751;
    const flow = this.flow();
    const step = S.requirementStep;
    const isLast = step === flow.length - 1;
    return React.createElement(PromptInputPlanCard, {
      variant: 'requirements',
      questions: flow,
      activeStep: step,
      answers: S.requirementAnswers,
      onAnswerChange: (i, v) => this.setState((s) => { const next = [...s.requirementAnswers]; next[i] = v; return { requirementAnswers: next }; }),
      additionalContext: { value: S.requirementContext, onChange: (e) => this.setState({ requirementContext: e.target.value }) },
      primaryAction: { label: isLast ? 'Submit' : 'Next', onClick: () => { if (isLast) this.submitRequirements(); else this.setState((s) => ({ requirementStep: Math.min(flow.length - 1, s.requirementStep + 1) })); } },
      tertiaryActions: [{ label: 'Close', onClick: () => this.skipQuestions() }, ...(step > 0 ? [{ label: 'Back', onClick: () => this.setState((s) => ({ requirementStep: Math.max(0, s.requirementStep - 1) })) }] : [])],
    });
  }

  renderVals() {
    const S = this.state;
    const historyItems = S.chats.map((c, i) => ({ id: String(i), title: c, active: i === S.activeChat, onClick: () => this.selectChat(i) }));
    return {
      messages: this.buildDisplayMessages(S.messages),
      draft: S.draft,
      onDraftChange: (v) => this.setState({ draft: v }),
      onSend: () => this.sendMessage(S.draft),
      onCopyMessage: (m) => this.copyMessage(m),
      onFeedback: (m, sentiment) => this.setFeedback(m, sentiment),
      onRetryMessage: () => {},
      onDownloadMessage: () => {},
      onSelectComparisonOption: () => {},
      onSubmitEdit: (m, text) => this.editMessage(m.__ci, text),
      onChangeVersion: (m, newVersion) => this.changeVersion(m.__ci, newVersion),
      onAtBottomChange: (atBottom) => this.setState({ atBottom }),
      scrollNonce: S.scrollNonce,
      showScrollToLatest: !S.atBottom,
      scrollToLatest: () => this.setState((s) => ({ scrollNonce: s.scrollNonce + 1, atBottom: true })),
      historyGroups: [
        { label: 'Today', items: historyItems.slice(0, 2) },
        { label: 'Previous 7 days', items: historyItems.slice(2) },
      ],
      newChat: () => this.newChat(),
      sidebarCollapsed: S.sidebarCollapsed,
      onSidebarCollapsedChange: (v) => this.setState({ sidebarCollapsed: v }),
      historySearch: S.historySearch,
      onHistorySearchChange: (v) => this.setState({ historySearch: v }),
      chatTitle: S.activeChat === -1 ? 'New chat' : (S.chats[S.activeChat] || 'Advisory desk triage'),
      onTitleChange: () => {},
      openLibrary: () => this.openLibrary(),
      closeLibrary: () => this.closeLibrary(),
      toggleLibrary: () => (S.libraryOpen ? this.closeLibrary() : this.openLibrary()),
      libraryOpen: S.libraryOpen,
      downloadChat: () => {},
      artifacts: this.artifacts(),
      downloadAllArtifacts: () => {},
      downloadArtifact: () => {},
      requirementsOverlay: this.requirementsOverlay(),
      composerHelperText: 'Fusion can make mistakes. Verify important information.',
      isWelcome: S.isWelcome,
      isChat: !S.isWelcome,
      welcomeTitle: 'New chat',
      welcomeDescription: 'What would you like to build, analyze, or discover today?',
      mainExtraClass: (S.previewOpen || S.libraryOpen) ? 'panel-open' : '',
      mainRailClass: S.sidebarCollapsed ? 'rail-collapsed' : '',
      historyMountClass: 'ai-history-mount' + (S.sidebarCollapsed ? ' collapsed' : ''),
      panelOpen: S.previewOpen || S.libraryOpen,
      previewOpen: S.previewOpen,
      previewTitle: (S.previewArtifact && S.previewArtifact.title) || '',
      previewSecondaryInfo: (S.previewArtifact && S.previewArtifact.secondaryInfo) || '',
      previewDescription: (S.previewArtifact && S.previewArtifact.description) || '',
      previewIcon: this.dsIcon('document', 28),
      closePreview: () => this.closePreview(),
      previewWidthPx: S.previewWidth,
      startPreviewResize: (e) => this.startPreviewResize(e),
      libraryListOpen: S.libraryOpen && !S.librarySelected,
      libraryDetailOpen: S.libraryOpen && !!S.librarySelected,
      libraryEmpty: this.artifacts().length === 0,
      librarySelectedTitle: (S.librarySelected && S.librarySelected.title) || '',
      librarySelectedDescription: (S.librarySelected && S.librarySelected.description) || '',
      artifactRows: this.artifacts().map((a) => {
        const IconButton = window.FusionDesignSystem_6db751 && window.FusionDesignSystem_6db751.IconButton;
        return {
          ...a,
          onView: () => this.selectLibraryItem(a),
          downloadButton: IconButton ? React.createElement(IconButton, { appearance: 'transparent', sentiment: 'neutral', 'aria-label': 'Download ' + a.title, title: 'Download' }, this.dsIcon('download', 16)) : null,
        };
      }),
      panelTitle: S.previewOpen ? ((S.previewArtifact && S.previewArtifact.title) || '') : (S.librarySelected ? S.librarySelected.title : 'Library'),
      panelSecondaryInfo: S.previewOpen ? ((S.previewArtifact && S.previewArtifact.secondaryInfo) || '') : '',
      panelDescription: S.previewOpen ? ((S.previewArtifact && S.previewArtifact.description) || '') : '',
      panelOnBack: (S.libraryOpen && S.librarySelected) ? (() => this.backLibrary()) : undefined,
      panelActions: S.previewOpen ? [] : (S.librarySelected ? [{ label: 'Download' }] : [{ label: 'Download All' }]),
      closeSidePanel: () => { this.closePreview(); this.closeLibrary(); },
    };
  }
}
</script>
</body>
</html>
