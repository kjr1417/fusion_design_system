<!-- @dsCard group="Components" viewport="320x760" name="Vertical Filter" subtitle="Faceted filter rail: header, search-and-page accordion groups, count badges" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../salt-components.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--salt-palette-background-secondary)}</style>
</head>
<body class="salt-theme">
<div id="root"></div>
<script type="text/babel">
const { VerticalFilter } = window.FusionDesignSystem_6db751;
function Demo() {
  const [values, setValues] = React.useState({ type: ["dataset"], domain: [], status: "active" });
  const domainOptions = ["AI Research", "Risk Analytics", "Markets Tech", "Corporate", "CDAO Data Eng.", "Advisory Desk", "Platform Engineering", "Compliance Ops", "Client Insights", "Treasury"].map((l) => ({ label: l, value: l }));
  return (
    <div style={{ width: 280 }}>
      <VerticalFilter
        groups={[
          { id: "type", label: "Type", type: "checkbox", options: [{ label: "Dataset", value: "dataset" }, { label: "Data Product", value: "dp" }, { label: "Model", value: "model" }, { label: "Use Case", value: "usecase" }] },
          { id: "domain", label: "Domain", type: "checkbox", options: domainOptions },
          { id: "status", label: "Status", type: "radio", options: [{ label: "Active", value: "active" }, { label: "Draft", value: "draft" }, { label: "Archived", value: "archived" }] },
          { id: "phase", label: "Phase", type: "checkbox", options: [{ label: "Planning", value: "planning" }, { label: "Development", value: "development" }, { label: "Production", value: "production" }] },
          { id: "owner", label: "Owner LOB", type: "radio", options: [{ label: "Corporate", value: "corporate" }, { label: "Markets", value: "markets" }, { label: "Risk", value: "risk" }] },
        ]}
        values={values}
        onChange={(id, v) => setValues((s) => ({ ...s, [id]: v }))}
      />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
