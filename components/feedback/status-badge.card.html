<!-- @dsCard group="Components" viewport="760x520" name="StatusBadge" subtitle="12x12 icon + label pair for record/workflow state" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../salt-components.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--salt-color-background-snow)}.col{display:flex;flex-direction:column;gap:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 24px}</style>
</head>
<body class="salt-theme">
<div id="root"></div>
<script type="text/babel">
const { StatusBadge } = window.FusionDesignSystem_6db751;
// one representative label per unique icon, per the spec
const icons = [
  ["progress-todo", "gray", "Not Started"],
  ["progress-draft", "blue", "Draft"],
  ["step-active", "blue", "Active"],
  ["clock_solid", "blue", "Pending"],
  ["progress-complete", "green", "Approved"],
  ["success-circle", "green", "Ready"],
  ["progress-onhold", "gray", "Paused"],
  ["progress-rejected", "red", "Removing"],
  ["progress-cancelled", "red", "Rejected"],
  ["loader", "blue", "Test Loading"],
  ["sync", "blue", "Running"],
  ["progress-inprogress", "blue", "In Progress"],
  ["refresh", "gray", "Rerun Test"],
  ["error-solid", "red", "Failed"],
  ["storage", "gray", "Archived"],
  ["progress-closed", "gray", "Expired"],
  ["undo", "gray", "Test Reverted"],
  ["warning-solid", "orange", "Review Required"],
];
function App() {
  return (
    <div className="grid">
      {icons.map(([file, color, label]) => (
        <div key={file} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <StatusBadge status={label} />
          <span style={{ fontFamily: "var(--salt-text-fontFamily)", fontSize: 11, color: "var(--salt-content-secondary-foreground)" }}>{file}.svg · {color}</span>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
