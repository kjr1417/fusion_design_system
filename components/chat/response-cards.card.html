<!-- @dsCard group="Chat" viewport="700x760" name="Response Cards" subtitle="Inline form (multi-step) + bordered artifact card + selectable cards + left-aligned submit" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../salt-components.css">
<link rel="stylesheet" href="../forms/FileUpload.css">
<link rel="stylesheet" href="../data/FileResultsGrid.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js?v=25"></script>
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--salt-container-primary-background)}</style>
</head>
<body class="salt-theme">
<div id="root"></div>
<script type="text/babel">
const { Card, FormField, Input, SelectableCard, InlineButtons, ArtifactCard, InlineFormCard, AnswerComparison } = window.FusionDesignSystem_6db751;

const sourceOptions = [
  { value: "crm", label: "CRM — Accounts", metadata: [{ label: "Type", value: "Database" }, { label: "Synced", value: "2h ago" }] },
  { value: "kb", label: "Knowledge Base", metadata: [{ label: "Type", value: "Docs" }, { label: "Synced", value: "1d ago" }] },
  { value: "tickets", label: "Support Tickets", metadata: [{ label: "Type", value: "Zendesk" }, { label: "Synced", value: "10m ago" }] },
  { value: "email", label: "Advisory Mailbox", metadata: [{ label: "Type", value: "Exchange" }, { label: "Synced", value: "1h ago" }] },
];
const teamOptions = [
  { value: "risk", label: "Risk Analytics", metadata: [{ label: "Members", value: "14" }, { label: "Region", value: "AMER" }] },
  { value: "markets", label: "Markets Tech", metadata: [{ label: "Members", value: "22" }, { label: "Region", value: "EMEA" }] },
  { value: "cdao", label: "CDAO Data Eng.", metadata: [{ label: "Members", value: "9" }, { label: "Region", value: "APAC" }] },
];

function App() {
  const [source, setSource] = React.useState("api");
  const [key, setKey] = React.useState("");
  return <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-400)" }}>

    <div>
      <div style={{ fontSize: 12, color: "var(--salt-content-secondary-foreground)", marginBottom: "var(--salt-spacing-100)" }}>Card container for an inline form</div>
      <Card variant="secondary" style={{ width: "100%" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-150)" }}>
          <FormField label="API key" necessity="required" helperText="Found in your integration settings.">
            <Input value={key} onChange={(e) => setKey(e.target.value)} placeholder="sk-…" />
          </FormField>
          <InlineButtons direction="right-to-left" primaryAction={{ label: "Connect", onClick: () => {} }} secondaryActions={[{ label: "Cancel", onClick: () => {} }]} />
        </div>
      </Card>
    </div>

    <div>
      <div style={{ fontSize: 12, color: "var(--salt-content-secondary-foreground)", marginBottom: "var(--salt-spacing-100)" }}>Inline form card — multi-step, ComboBoxMetadataOverlay (max 3) + FileUpload + Skip / Next</div>
      <InlineFormCard
        steps={[
          {
            title: "Connect data sources",
            description: "Choose up to three sources to ground this response in your team's data.",
            fieldLabel: "Data sources",
            fieldPlaceholder: "Search sources…",
            fieldHelperText: "You can change this later from the source list.",
            options: sourceOptions,
            uploadTitle: "Attach supporting files",
            uploadDescription: "Optional — reference files for this connection.",
          },
          {
            title: "Route to a team",
            description: "Pick up to three teams who should review this before it's shared out.",
            fieldLabel: "Reviewing teams",
            fieldPlaceholder: "Search teams…",
            fieldHelperText: "Reviewers are notified once you finish this form.",
            options: teamOptions,
            uploadTitle: "Attach review notes",
          },
        ]}
        onComplete={(result) => console.log("form complete", result)}
        style={{ width: "100%", maxWidth: "none" }}
      />
    </div>

    <div>
      <div style={{ fontSize: 12, color: "var(--salt-content-secondary-foreground)", marginBottom: "var(--salt-spacing-100)" }}>Artifact card — bordered, dropped inline into a response</div>
      <ArtifactCard
        bordered
        eyebrow="Report"
        title="Advisory Desk Email Summary.pdf"
        description="Generated from the 60-day mailbox export"
        items={[{ label: "Size", value: "2.1 MB" }, { label: "Created", value: "Aug 13, 2026" }, { label: "Pages", value: "6" }]}
        actionLabel="View"
        onAction={() => {}}
        onDownload={() => {}}
        style={{ width: "100%" }}
      />
    </div>

    <div>
      <div style={{ fontSize: 12, color: "var(--salt-content-secondary-foreground)", marginBottom: "var(--salt-spacing-100)" }}>Answer comparison — even split per option, collapses to tabs when narrow</div>
      <AnswerComparison
        options={[
          { label: "Option A — concise", text: "12 items flagged Platinum. Escalate before Friday's sync." },
          { label: "Option B — detailed", text: "12 items across 8 themes are flagged Platinum tier. Per the desk-owner playbook, each pages the on-call lead if unread after 1 hour — escalate all 12 before Friday's leadership sync." },
        ]}
        onSelect={(i) => console.log("picked", i)}
      />
    </div>

    <div>
      <div style={{ fontSize: 12, color: "var(--salt-content-secondary-foreground)", marginBottom: "var(--salt-spacing-100)" }}>Selectable cards — max 2 per row, max 1 row — with a left-aligned submit action</div>
      <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-150)", width: "100%" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "var(--salt-spacing-150)" }}>
          <SelectableCard name="source" title="Governed dataset" description="Connect a dataset from the catalog" selected={source === "dataset"} onChange={() => setSource("dataset")} />
          <SelectableCard name="source" title="External API" description="Call an API directly" selected={source === "api"} onChange={() => setSource("api")} />
        </div>
        <InlineButtons direction="left-to-right" primaryAction={{ label: "Continue", onClick: () => {} }} />
      </div>
    </div>

  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
