<!-- @dsCard group="Components" viewport="480x360" name="Image Preview" subtitle="Hover Copy/Expand toolbar + expand dialog" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../salt-components.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js?v=36"></script>
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--salt-container-primary-background)}</style>
</head>
<body class="salt-theme">
<div id="root"></div>
<script type="text/babel">
const { ImagePreview } = window.FusionDesignSystem_6db751;
function App() {
  const images = [
    { src: "https://picsum.photos/seed/fusion-wide/900/380", alt: "Wide chart (wider than tall)" },
    { src: "https://picsum.photos/seed/fusion-tall/420/720", alt: "Tall chart (taller than wide)" },
    { src: "https://picsum.photos/seed/fusion-square/560/560", alt: "Square chart (equal ratio)" },
  ];
  return <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
    <ImagePreview src={images[0].src} alt={images[0].alt} />
    <ImagePreview src={images[1].src} alt={images[1].alt} />
    <ImagePreview src={images[2].src} alt={images[2].alt} />
    <div>
      <div style={{ fontSize: 12, color: "var(--salt-content-secondary-foreground)", marginBottom: 8 }}>Gallery (Expand any to see Back/Next):</div>
      {images.map((img, i) => <div key={i} style={{ marginBottom: 12 }}><ImagePreview src={img.src} alt={img.alt} images={images} index={i} /></div>)}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
