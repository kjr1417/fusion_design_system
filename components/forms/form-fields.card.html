<!-- @dsCard group="Components" viewport="1080x760" name="Forms — Field types" subtitle="FormField anatomy, toggletips, combo boxes, selectable cards, date/number/time fields, checkbox/radio groups" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../salt-components.css">
<link rel="stylesheet" href="../display/ExpandableText.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:32px;background:var(--salt-palette-background-secondary)}</style>
</head>
<body class="salt-theme">
<div id="root"></div>
<script type="text/babel">
const {
  FormField, Input, MultilineInput, ComboBox, SelectableCard, Checkbox, CheckboxGroup,
  RadioButton, RadioButtonGroup, ToggleButtonGroup, DatePicker, RangeDatePicker, TimeInput, NumberInput,
  CurrencyInput, Dropdown, H4, Divider, GridLayout, SectionHeader, Accordion,
} = window.FusionDesignSystem_6db751;

const CalendarGlyph = () => (<svg viewBox="0 0 12 12" width="12" height="12" fill="currentColor"><path d="M4 0v1h4V0h1v1h3v11H0V1h3V0zm7 4H1v7h10zM9 2H8v1h1zM4 2H3v1h1z"></path></svg>);
const SearchGlyph = () => (<svg viewBox="0 0 12 12" width="12" height="12" fill="currentColor"><path fillRule="evenodd" clipRule="evenodd" d="M8 9a5 5 0 1 1 1-1l3 3-1 1zm1-4a4 4 0 1 1-8 0 4 4 0 0 1 8 0"></path></svg>);
const DomainIcon = () => (<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>);
const AgentIcon = () => (<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="8" width="14" height="10" rx="2.5"/><path d="M12 5v3M9 13h.01M15 13h.01"/><circle cx="12" cy="4" r="1"/></svg>);
const ModelIcon = () => (<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M12 3v3M12 18v3M4.9 7l2.1 1.2M17 15.8 19.1 17M4.9 17l2.1-1.2M17 8.2 19.1 7"/><circle cx="12" cy="12" r="3.4"/></svg>);

const domainOptions = [
  { value: "data", label: "Data engineering" },
  { value: "ai", label: "AI / ML" },
  { value: "governance", label: "Governance" },
  { value: "risk", label: "Risk analytics" },
  { value: "markets", label: "Markets tech" },
  { value: "ops", label: "Operations" },
  { value: "longdomain", label: "Enterprise Data Quality & Metadata Governance" },
];
const teamOptions = [
  { value: "cdao", label: "CDAO Data Engineering" },
  { value: "markets", label: "Markets Tech" },
  { value: "risk", label: "Risk Analytics" },
  { value: "compliance", label: "Compliance Systems" },
];

function ValidationDemo() {
  const [nameErr, setNameErr] = React.useState(true);
  const [teamErr, setTeamErr] = React.useState(true);
  const [classErr, setClassErr] = React.useState(true);
  const [budgetErr, setBudgetErr] = React.useState(true);
  const [accessErr, setAccessErr] = React.useState(true);
  return (
    <GridLayout columns={2} gap={9}>
      <FormField label="Dataset name" necessity="required" error={nameErr} errorMessage="Dataset name is required.">
        <Input validationState={nameErr ? "error" : undefined} placeholder="Enter dataset name" onChange={(e) => setNameErr(e.target.value.trim().length === 0)} />
      </FormField>
      <FormField label="Owning team" necessity="required" error={teamErr} errorMessage="Select a team before continuing." style={{ width: 280 }}>
        <ComboBox validationState={teamErr ? "error" : undefined} options={teamOptions} placeholder="Select team" style={{ width: 280 }} onChange={(v) => setTeamErr(!v)} />
      </FormField>
      <FormField label="Classification" necessity="required" error={classErr} errorMessage="Choose a classification level.">
        <Dropdown validationState={classErr ? "error" : undefined} defaultValue="" options={["Public", "Internal", "Confidential", "Restricted"]} onChange={(e) => setClassErr(!e.target.value)} />
      </FormField>
      <FormField label="Budget" necessity="required" error={budgetErr} errorMessage="Enter an amount greater than 0.">
        <CurrencyInput validationState={budgetErr ? "error" : undefined} defaultValue="" onChange={(e) => setBudgetErr(!(parseFloat((e.target.value || "").replace(/[^0-9.]/g, "")) > 0))} />
      </FormField>
      <FormField label="Access" necessity="required">
        <CheckboxGroup
          direction="horizontal"
          defaultValue={[]}
          error={accessErr}
          errorMessage="Select at least one access level."
          onChange={(vals) => setAccessErr(vals.length === 0)}
          options={[
            { value: "read", label: "Read" },
            { value: "write", label: "Write" },
            { value: "admin", label: "Admin" },
          ]}
        />
      </FormField>
    </GridLayout>
  );
}

function AccordionValidationDemo() {
  const [teamErr, setTeamErr] = React.useState(true);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-100)", marginTop: "var(--salt-spacing-200)" }}>
      <span style={{ fontSize: "var(--salt-text-label-fontSize)", fontWeight: "var(--salt-text-fontWeight-strong)", color: "var(--salt-content-primary-foreground)" }}>Accordion — collapsed section with a field error</span>
      <Accordion
        variant="boxed"
        defaultOpen={-1}
        items={[
          { title: "Ownership", hasError: teamErr, content: (
            <FormField label="Owning team" necessity="required" error={teamErr} errorMessage="Select a team before continuing.">
              <ComboBox validationState={teamErr ? "error" : undefined} options={teamOptions} placeholder="Select team" onChange={(v) => setTeamErr(!v)} />
            </FormField>
          ) },
          { title: "Access", content: <span>No errors in this section.</span> },
        ]}
      />
    </div>
  );
}

function SubLabel({ children }) {
  return <span style={{ fontSize: "var(--salt-text-label-fontSize)", fontWeight: "var(--salt-text-fontWeight-strong)", color: "var(--salt-content-secondary-foreground)" }}>{children}</span>;
}

function ConditionalModeDemo() {
  const [mode, setMode] = React.useState("individual");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-100)" }}>
      <SubLabel>ToggleButtonGroup — switches the whole panel below</SubLabel>
      <ToggleButtonGroup options={[{ label: "Individual", value: "individual" }, { label: "Organization", value: "organization" }]} defaultValue="individual" onChange={setMode} style={{ marginBottom: 0 }} />
      {mode === "individual" ? (
        <GridLayout columns={2} gap={9}>
          <FormField label="Full name" necessity="required"><Input placeholder="Enter full name" /></FormField>
          <FormField label="Date of birth" necessity="required"><DatePicker /></FormField>
        </GridLayout>
      ) : (
        <GridLayout columns={2} gap={9}>
          <FormField label="Organization name" necessity="required"><Input placeholder="Enter organization name" /></FormField>
          <FormField label="Tax ID" necessity="required"><Input placeholder="Enter tax ID" /></FormField>
        </GridLayout>
      )}
    </div>
  );
}

function ConditionalFieldDemo() {
  const [notify, setNotify] = React.useState("email");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-100)" }}>
      <SubLabel>RadioButtonGroup — reveals only the field this choice needs</SubLabel>
      <FormField label="Notification method" necessity="required">
        <RadioButtonGroup name="notify" direction="horizontal" defaultValue="email" options={[{ label: "Email", value: "email" }, { label: "SMS", value: "sms" }]} onChange={setNotify} />
      </FormField>
      {notify === "email" ? (
        <FormField label="Email address" necessity="required"><Input placeholder="Enter email address" /></FormField>
      ) : (
        <FormField label="Phone number" necessity="required"><Input placeholder="Enter phone number" /></FormField>
      )}
    </div>
  );
}

function ConditionalCardDemo() {
  const [kind, setKind] = React.useState("dataset");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-100)" }}>
      <SubLabel>SelectableCard — reveals only the field this choice needs</SubLabel>
      <GridLayout columns={2} gap={9}>
        <SelectableCard title="Dataset" description="Connect a governed dataset" selected={kind === "dataset"} onChange={() => setKind("dataset")} />
        <SelectableCard title="API" description="Call an external API directly" selected={kind === "api"} onChange={() => setKind("api")} />
      </GridLayout>
      {kind === "dataset" ? (
        <FormField label="Dataset" necessity="required"><ComboBox options={teamOptions} placeholder="Select dataset" /></FormField>
      ) : (
        <FormField label="API endpoint URL" necessity="required"><Input placeholder="Enter API endpoint URL" /></FormField>
      )}
    </div>
  );
}

function ConditionalComboBoxDemo() {
  const [env, setEnv] = React.useState("");
  const envOptions = [{ value: "aws", label: "AWS" }, { value: "gcp", label: "Google Cloud" }, { value: "onprem", label: "On-premises" }];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-100)" }}>
      <SubLabel>ComboBox — selection reveals that environment's connection fields</SubLabel>
      <FormField label="Hosting environment" necessity="required" helperText="Selecting an environment reveals its connection fields." style={{ width: 280 }}>
        <ComboBox options={envOptions} placeholder="Select hosting environment" style={{ width: 280 }} onChange={setEnv} />
      </FormField>
      {env === "aws" && <FormField label="AWS region" necessity="required"><Input placeholder="Enter AWS region" /></FormField>}
      {env === "gcp" && <FormField label="GCP project ID" necessity="required"><Input placeholder="Enter GCP project ID" /></FormField>}
      {env === "onprem" && <FormField label="Server hostname" necessity="required"><Input placeholder="Enter server hostname" /></FormField>}
    </div>
  );
}

function Section({ title, description, children }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-100)" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
        <H4 style={{ margin: 0 }}>{title}</H4>
        {description && <span style={{ fontSize: "var(--salt-text-fontSize)", color: "var(--salt-content-secondary-foreground)" }}>{description}</span>}
      </div>
      <Divider />
      {children}
    </div>
  );
}

function App() {
  const [source, setSource] = React.useState("card-1");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-300)", maxWidth: 720 }}>

      <Section title="Validation" description="Field-level errors use Salt's built-in error styling — red border/background, the field's own adornment replaced by a red status circle, and a red error message with icon below the field (rendered via FormField's built-in Status pattern, announced to screen readers via an alert role). Multiple errors on a page also get a summary banner at the top, in the form header — see Section header above. Once a field becomes valid it simply returns to default styling — there is no success/green state. Try editing a field below.">
        <ValidationDemo />
        <AccordionValidationDemo />
      </Section>

      <Section title="Section header" description="Recurring section-opening pattern: status banners, a required-field note with an optional-fields switch, the title, and an expandable description.">
        <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-450)" }}>
          <SectionHeader title="Account details" description="Basic identifying information used across billing, support, and reporting for this account and every dataset registered under it." />
          <Divider />
          <SectionHeader
            title="Compliance review"
            errorBanners={["2 fields need attention before you can submit."]}
            infoBanners={["Changes here require a second approver."]}
            description="Reviewed annually by the data governance office."
          />
          <Divider />
          <SectionHeader title="Ownership" />
          <Divider />
          <SectionHeader titleVariant="h4" title="Preferences" showRequiredNote={false} showOptionalToggle={false} description="Chat-only compact title, no required note or switch." />
        </div>
      </Section>

      <Section title="Label with toggletip" description="Click the info glyph next to a label to disclose supplementary guidance without cluttering the field with permanent helper text. The toggletip floats to the field's right edge — short labels sit right next to it, long labels wrap underneath.">
        <GridLayout columns={2} gap={9}>
          <FormField
            label="Classification"
            necessity="required"
            toggletip="Classification determines who can query this dataset. Choose the highest level of any field it contains — see the Data Handling Standard for definitions."
            helperText="Applies to every column unless overridden per-field."
          >
            <Dropdown options={["Public", "Internal", "Confidential", "Restricted"]} defaultValue="Internal" />
          </FormField>
          <FormField
            label="Regulatory data retention classification period"
            necessity="required"
            toggletip="Retention classification is set once at creation and cannot be changed later without a compliance review."
          >
            <Dropdown options={["Standard", "Extended", "Litigation hold"]} defaultValue="Standard" />
          </FormField>
        </GridLayout>
      </Section>

      <Section title="Text input" description={'Empty state placeholder is "Enter {value}", contextual to the field.'}>
        <GridLayout columns={2} gap={9}>
          <FormField label="Dataset name" necessity="required" helperText="Shown to consumers in the catalog listing.">
            <Input placeholder="Enter dataset name" />
          </FormField>
          <FormField
            label="Slug"
            necessity="required"
            helperText="Lowercase, hyphenated. Auto-generated from the name unless"
            helperLinkText="edited manually."
            helperLinkHref="#"
          >
            <Input placeholder="Enter slug" startAdornment={<span>/</span>} />
          </FormField>
        </GridLayout>
        <FormField
          label="Contact email"
          necessity="required"
          error
          errorMessage="Enter a valid work email address. Personal domains (gmail.com, outlook.com, yahoo.com) are not accepted for data ownership records."
        >
          <Input defaultValue="jane.doe@personal-mail.com" validationState="error" endAdornment={<span>@</span>} />
        </FormField>
        <FormField label="Display name" necessity="required" helperText="Shown on shared links and exports.">
          <Input characterLimit={24} defaultValue="Q3 Risk Review" />
        </FormField>
      </Section>

      <Section title="Combo box" description={'Search-ahead select — single-select fills the field and closes the list; multi-select keeps it open and renders picks as chips. Empty state placeholder is "Select {value}", contextual to the field.'}>
        <div style={{ display: "flex", gap: "var(--salt-spacing-450)" }}>
          <FormField label="Owning team" necessity="required" helperText="Search by team name." style={{ width: 280 }}>
            <ComboBox options={teamOptions} placeholder="Select team" style={{ width: 280 }} />
          </FormField>
          <FormField label="Data domains" helperText="Select every domain this dataset touches." style={{ width: 280 }}>
            <ComboBox multiselect options={domainOptions} defaultValue={["data", "ai", "governance", "risk", "longdomain"]} style={{ width: 280 }} />
          </FormField>
        </div>
      </Section>

      <Section title="Multiline input">
        <FormField label="Description" necessity="optional" helperText="Describe the content, audience, and scope of this knowledge base.">
          <MultilineInput rows={3} placeholder="Enter description" />
        </FormField>
        <FormField label="Support notes" helperText="Visible only to the owning team." toggletip="Notes never appear to end users — use them for handoff context, known issues, or renewal reminders.">
          <MultilineInput rows={3} placeholder="Enter support notes" startAdornment={<SearchGlyph />} />
        </FormField>
        <FormField label="Short summary" necessity="required" helperText="One or two sentences — shown in list views.">
          <MultilineInput rows={2} characterLimit={120} defaultValue="Central FAQ set for the support team, refreshed weekly from ticket themes." />
        </FormField>
      </Section>

      <Section title="Selectable cards" description="Card-style single- or multi-select — same interaction as radio/checkbox, different affordance for a handful of richer options.">
        <GridLayout columns={3} gap={3}>
          <SelectableCard icon={<DomainIcon />} title="Data source" description="Connect a governed dataset" selected={source === "card-1"} onChange={() => setSource("card-1")} />
          <SelectableCard icon={<AgentIcon />} title="Agent" description="Point at an existing agent" selected={source === "card-2"} onChange={() => setSource("card-2")} />
          <SelectableCard icon={<ModelIcon />} title="Model endpoint" description="Call a model directly" selected={source === "card-3"} onChange={() => setSource("card-3")} />
        </GridLayout>
      </Section>

      <Section title="Conditional logic" description="Selections drive which fields or sections appear. ToggleButtonGroup switches the whole panel — use for high-priority, mutually-exclusive modes that change the overall context. SelectableCard/RadioButtonGroup reveal only the specific fields tied to a lower-priority, granular choice within a section. ComboBox selections can drive the same pattern, revealing fields relevant to the picked option. Only visible fields are required for validation — hidden fields are ignored.">
        <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-300)" }}>
          <ConditionalModeDemo />
          <Divider />
          <ConditionalFieldDemo />
          <Divider />
          <ConditionalCardDemo />
          <Divider />
          <ConditionalComboBoxDemo />
        </div>
      </Section>

      <Section title="Small-size fields" description="Compact variants for dense, paired rows. Date/time fields show their expected entry pattern (dd mmm yyyy / hh mm aa) as placeholder text until a value is set.">
        <div style={{ display: "flex", flexDirection: "column", gap: "var(--salt-spacing-100)" }}>
          <FormField label="Reference name" necessity="required">
            <Input size="small" placeholder="Enter reference name" />
          </FormField>
          <GridLayout columns={2} gap={9}>
            <FormField label="City" necessity="required">
              <ComboBox size="small" options={[{ value: "nyc", label: "New York" }, { value: "lon", label: "London" }, { value: "sng", label: "Singapore" }]} placeholder="Select city" />
            </FormField>
            <FormField label="State / region">
              <Input size="small" placeholder="Enter state or region" />
            </FormField>
          </GridLayout>
          <GridLayout columns={2} gap={9}>
            <FormField label="Start date" necessity="required">
              <DatePicker size="small" defaultValue="18 Mar 2026" />
            </FormField>
            <FormField label="End date" necessity="required" helperText="Empty state shows the expected entry pattern.">
              <DatePicker size="small" />
            </FormField>
          </GridLayout>
          <FormField label="Reporting period" necessity="required" helperText="Range spanning both fields.">
            <RangeDatePicker size="small" />
          </FormField>
          <GridLayout columns={2} gap={9}>
            <FormField label="Budget" necessity="required">
              <CurrencyInput size="small" defaultValue="12,480.55" />
            </FormField>
            <FormField label="Headcount">
              <NumberInput size="small" placeholder="Enter headcount" />
            </FormField>
          </GridLayout>
          <FormField label="Daily standup time" necessity="required">
            <TimeInput defaultValue="09:30 AM" />
          </FormField>
          <FormField label="Meeting time" necessity="required" helperText="Empty state shows the expected entry pattern.">
            <TimeInput />
          </FormField>
          <FormField label="System maintenance window (24h, with seconds)" necessity="required">
            <TimeInput mode="24h" showSeconds defaultValue="14:05:30" />
          </FormField>
        </div>
      </Section>

      <Section title="Checkbox group">
        <GridLayout columns={2} gap={9}>
          <FormField label="Notification channels" helperText="Vertical layout — default for 4+ options.">
            <CheckboxGroup
              direction="vertical"
              defaultValue={["email"]}
              options={[
                { value: "email", label: "Email" },
                { value: "sms", label: "SMS" },
                { value: "slack", label: "Slack" },
                { value: "push", label: "Push notification" },
              ]}
            />
          </FormField>
          <FormField label="Access" necessity="required" helperText="Horizontal layout — use for 2–3 short options.">
            <CheckboxGroup
              direction="horizontal"
              defaultValue={["read"]}
              options={[
                { value: "read", label: "Read" },
                { value: "write", label: "Write" },
                { value: "admin", label: "Admin" },
              ]}
            />
          </FormField>
        </GridLayout>
      </Section>

      <Section title="Radio button group">
        <GridLayout columns={2} gap={9}>
          <FormField label="Retention policy" necessity="required" helperText="Vertical layout — default for 4+ options.">
            <RadioButtonGroup
              name="retention"
              direction="vertical"
              defaultValue="90"
              options={[
                { value: "30", label: "30 days" },
                { value: "90", label: "90 days" },
                { value: "365", label: "1 year" },
                { value: "forever", label: "Indefinite" },
              ]}
            />
          </FormField>
          <FormField label="Visibility" necessity="required" helperText="Horizontal layout — use for 2–3 short options.">
            <RadioButtonGroup
              name="visibility"
              direction="horizontal"
              defaultValue="team"
              options={[
                { value: "private", label: "Private" },
                { value: "team", label: "Team" },
                { value: "org", label: "Org-wide" },
              ]}
            />
          </FormField>
        </GridLayout>
      </Section>

    </div>
  );
}
const mount = () => ReactDOM.createRoot(document.getElementById('root')).render(<App />);
document.fonts && document.fonts.ready ? document.fonts.ready.then(mount) : mount();
</script>
</body>
</html>
