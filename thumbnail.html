<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:854px;display:flex;font-family:var(--salt-typography-fontFamily-sans)}
.main{flex:0 0 75%;height:100%;background:var(--salt-color-blue-600);display:flex;align-items:center;justify-content:center}
.main img{width:560px;filter:brightness(0) invert(1)}
.strip{flex:1;height:100%;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body class="salt-theme">
<div class="main"><img src="assets/logo.svg"></div>
<div class="strip">
<div style="background:var(--salt-color-blue-300)"></div>
<div style="background:var(--salt-color-blue-500)"></div>
<div style="background:var(--salt-color-blue-700)"></div>
<div style="background:var(--salt-color-blue-900)"></div>
</div>
</body></html>
